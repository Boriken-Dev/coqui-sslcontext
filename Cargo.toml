[package]
name = "coqui-sslcontext"
version = "0.0.0-alpha.0"
description = "rustls configurations that follow the system: the OS trust store, client certificates held in OS keystores, server configurations, pins and a test CA"
readme = "README.md"
edition = "2024"
# edition 2024 needs 1.85; rcgen (tests) needs 1.88.
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Boriken-Dev/coqui-sslcontext"
keywords = ["tls", "rustls", "client-certificate", "pkcs11", "system"]
categories = ["network-programming", "cryptography"]
# Git dependencies cannot be published to crates.io.
publish = false
exclude = [".*", "*.local.*", "/tools/"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
# The operating system's keystores and the browsers' client-certificate policy: Windows CNG and the
# registry, the macOS Keychain.
system = ["dep:windows-registry", "dep:rustls-cng", "dep:security-framework", "dep:windows-sys", "dep:plist"]
# Client certificates held by a PKCS#11 module (smart cards, tokens, SoftHSM).
pkcs11 = ["dep:cryptoki"]
# Identities from PKCS#12 files (`Identity::from_pkcs12`), legacy RC2 and 3DES ciphers included.
pkcs12 = ["dep:p12-keystore"]
# Encrypted PKCS#8 private keys (`KeyPassword`).
encrypted-keys = ["dep:pkcs8"]
# A certificate authority and the leaf certificates it issues (`CertificateAuthority`).
issue = ["dep:rcgen", "dep:time", "dep:rsa", "dep:rand_core"]

[dependencies]
# Client and server configurations; TLS is this crate's purpose, so it is not optional.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
# The operating system's server verification.
rustls-platform-verifier = "0.7"
# The system's root certificates, to verify client certificates against them.
rustls-native-certs = "0.8"
# Subject, issuer, validity and key usage of a candidate client certificate.
x509-cert = { version = "0.3", default-features = false, features = ["std"] }
# The identity of a certificate, for a remembered choice.
sha2 = { version = "0.10", default-features = false }
# Browser auto-select policy entries.
serde_json = "1"
# macOS managed preferences (feature `system`).
plist = { version = "1", optional = true }
# Error boilerplate.
thiserror = "2"
# Certificate pins are written in base64.
base64 = "0.22"
# Diagnostics.
tracing = { version = "0.1", default-features = false, features = ["std"] }
cryptoki = { version = "0.12", optional = true }
# Wipes PINs and passwords from memory when they are dropped.
zeroize = "1"
# The SHA-1 thumbprint of a certificate.
sha1 = { version = "0.10", default-features = false }
p12-keystore = { version = "0.4", optional = true }
pkcs8 = { version = "0.11", default-features = false, features = ["alloc", "pem", "encryption", "getrandom"], optional = true }
# Certificates for `CertificateAuthority` (feature `issue`).
rcgen = { version = "0.14", features = ["x509-parser"], optional = true }
time = { version = "0.3", default-features = false, optional = true }
# RSA keys, which rcgen cannot make with its ring backend.
rsa = { version = "0.9", optional = true }
rand_core = { version = "0.6", features = ["getrandom"], optional = true }

[target.'cfg(windows)'.dependencies]
# Windows certificate stores and CNG keys as rustls signing keys (feature `system`).
rustls-cng = { version = "0.7", default-features = false, features = ["ring", "tls12"], optional = true }
# Browser auto-select policy in the registry (feature `system`).
windows-registry = { version = "0.6", optional = true }
# Setting a smart card PIN on a CNG key (feature `system`).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
# The Keychain's identities as rustls signing keys (feature `system`).
security-framework = { version = "3", optional = true }

[dev-dependencies]
p12-keystore = "0.4"
pkcs8 = { version = "0.11", default-features = false, features = ["alloc", "pem", "encryption", "getrandom"] }
# Test CA, server and client certificates, generated by each test.
rcgen = "0.14"
tempfile = "3"
