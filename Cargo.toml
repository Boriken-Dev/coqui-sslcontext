[package]
name = "coqui-sslcontext"
version = "0.0.0-alpha.0"
description = "rustls configurations that follow the system: the OS trust store, client certificates held in OS keystores, server configurations, pins and a test CA"
readme = "README.md"
edition = "2024"
# edition 2024 needs 1.85; rcgen (tests) needs 1.88.
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Boriken-Dev/coqui-sslcontext"
keywords = ["tls", "rustls", "client-certificate", "pkcs11", "system"]
categories = ["network-programming", "cryptography"]
# Git dependencies cannot be published to crates.io.
publish = false
exclude = [".*", "*.local.*", "/tools/"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
# The operating system's keystores and the browsers' client-certificate policy: Windows CNG and the
# registry, the macOS Keychain.
system = ["dep:windows-registry", "dep:rustls-cng", "dep:security-framework", "dep:windows-sys"]
# Client certificates held by a PKCS#11 module (smart cards, tokens, SoftHSM).
pkcs11 = ["dep:cryptoki"]

[dependencies]
# Client and server configurations; TLS is this crate's purpose, so it is not optional.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
# The operating system's server verification.
rustls-platform-verifier = "0.7"
# Subject, issuer, validity and key usage of a candidate client certificate.
x509-cert = { version = "0.3", default-features = false, features = ["std"] }
# The identity of a certificate, for a remembered choice.
sha2 = { version = "0.10", default-features = false }
# Browser auto-select policy entries.
serde_json = "1"
# Error boilerplate.
thiserror = "2"
# Diagnostics.
tracing = { version = "0.1", default-features = false, features = ["std"] }
cryptoki = { version = "0.12", optional = true }
# Wipes PINs and passwords from memory when they are dropped.
zeroize = "1"

[target.'cfg(windows)'.dependencies]
# Windows certificate stores and CNG keys as rustls signing keys (feature `system`).
rustls-cng = { version = "0.7", default-features = false, features = ["ring", "tls12"], optional = true }
# Browser auto-select policy in the registry (feature `system`).
windows-registry = { version = "0.6", optional = true }
# Setting a smart card PIN on a CNG key (feature `system`).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
# The Keychain's identities as rustls signing keys (feature `system`).
security-framework = { version = "3", optional = true }

[dev-dependencies]
# Test CA, server and client certificates, generated by each test.
rcgen = "0.14"
p12-keystore = "0.4"
tempfile = "3"
